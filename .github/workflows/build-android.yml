name: Build Vibe.ly Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Build social app web assets
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jzcxybjtexyeoweyelfg.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Tdf_dP30ClMxZBaJ7E9a9Q_oazifpN-

      - name: Build Vibe.ly Social APK
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ly.vibe.social",
            "appName": "Vibe.ly",
            "webDir": "out",
            "server": {
              "url": "https://dubemascend-png.github.io/vibely-social/",
              "cleartext": false,
              "androidScheme": "https"
            },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Vibe-ly-Social.apk
          rm -rf android

      - name: Build Vibe.ly Admin APK
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ly.vibe.admin",
            "appName": "Vibe.ly Admin",
            "webDir": "out",
            "server": {
              "url": "https://dubemascend-png.github.io/vibely-social/admin/",
              "cleartext": false,
              "androidScheme": "https"
            },
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Vibe-ly-Admin.apk

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: vibely-android-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-downloads
          name: Vibe.ly Android Downloads
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            artifacts/Vibe-ly-Social.apk
            artifacts/Vibe-ly-Admin.apk
